site_name: Sailor Hat for Raspberry Pi
site_url: https://docs.hatlabs.fi/sh-rpi
site_description: Documentation for Sailor Hat for Raspberry Pi (SH-RPi), a power management board for Raspberry Pi
site_author: Hat Labs

repo_url: https://github.com/hatlabs/SH-RPi
repo_name: hatlabs/SH-RPi
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/hat_labs_logo.svg
  favicon: assets/hat_labs_logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
