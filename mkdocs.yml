markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  analytics:
    provider: google
    property: G-F3KDPEBJEF
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hatlabs

nav:
  - Introduction: index.md
  - Getting Started: getting-started/index.md
  - Hardware:
    - Hardware Description: hardware/index.md
  - Software:
    - Software: software/index.md
  - FAQ: faq/index.md
  - Hardware Revisions: revisions/index.md
  - Errata: errata/index.md
  - Add-on Hardware:
    - Overview: add-ons/index.md
    - Compute Module 4: add-ons/cm4/index.md
    - CAN HAT: add-ons/can-hat/index.md
    - RS485 HAT: add-ons/rs485-hat/index.md
    - GNSS HAT: add-ons/gnss-hat/index.md
  - Tutorials:
    - Overview: tutorials/index.md
    - OpenPlotter Server: tutorials/openplotter-server/index.md
